  /api/users/self/tokens:
    $ref: './paths/tokens.yaml#/collection'
  /api/users/self/tokens/{id}:
    $ref: './paths/tokens.yaml#/item'
  /api/users/self/webhooks:
    $ref: './paths/webhooks.yaml#/collection'
  /api/users/self/webhooks/{id}:
    $ref: './paths/webhooks.yaml#/item'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: broadsheet_session
