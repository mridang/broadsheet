openapi: 3.1.0
info:
  title: Broadsheet API
  version: 0.0.1
  summary: Follow feeds and read them as a newspaper.
  description: |
    The REST contract under `/api` follows the [Zalando RESTful API Guidelines](https://opensource.zalando.com/restful-api-guidelines/) with the deviations in the `api-design` skill: JSON properties are snake_case, ids are opaque strings, timestamps are RFC 3339, and every error is `application/problem+json`.

    Every route needs a signed-in session (the `broadsheet_session` cookie set by the browser sign-in flow) and acts for that person. A request that changes something must come from the app's own pages: a cross-site request is refused with `403`. Requests are rate limited by the platform, and a blocked request is answered with `429` and `Retry-After`.

    Each resource lives in its own file under `paths/`, so new resources are added without touching the others. Add a path here that points at the new file.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
security:
  - session: []
tags:
  - name: feeds
  - name: sessions
paths:
  /api/feeds:
    $ref: './paths/feeds.yaml#/collection'
  /api/feeds/{id}:
    $ref: './paths/feeds.yaml#/item'
  /api/feeds/refreshes:
    $ref: './paths/feeds.yaml#/refreshes'
  /api/sessions:
    $ref: './paths/sessions.yaml#/collection'
  /api/sessions/self:
    $ref: './paths/sessions.yaml#/self'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: broadsheet_session
