openapi: 3.1.0
info:
  title: Broadsheet API
  version: 0.0.1
  summary: Follow feeds and read them as a newspaper.
  description: |
    The REST contract under `/api` follows the [Zalando RESTful API Guidelines](https://opensource.zalando.com/restful-api-guidelines/) with the deviations in the `api-design` skill: JSON properties are snake_case, ids are opaque strings, timestamps are RFC 3339, and every error is `application/problem+json`.

    Every route except `GET /api/push/configuration` needs a signed-in session (the `broadsheet_session` cookie set by the browser sign-in flow) and acts for that person. A request that changes something must come from the app's own pages: a cross-site request is refused with `403`. Requests are rate limited by the platform, and a blocked request is answered with `429` and `Retry-After`.

    Each resource lives in its own file under `paths/`, so new resources are added without touching the others. Add a path here that points at the new file.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
security:
  - session: []
tags:
  - name: articles
  - name: answers
  - name: classifiers
  - name: editions
  - name: conversations
  - name: emails
  - name: feeds
  - name: notifications
  - name: push
  - name: sections
  - name: preferences
  - name: reads
  - name: saves
  - name: searches
  - name: sessions
  - name: tokens
  - name: topics
  - name: webhooks
paths:
  /api/articles:
    $ref: './paths/articles.yaml#/collection'
  /api/articles/{id}:
    $ref: './paths/articles.yaml#/item'
  /api/editions:
    $ref: './paths/editions.yaml#/collection'
  /api/editions/{id}:
    $ref: './paths/editions.yaml#/item'
  /api/editions/{id}/issues/{date}:
    $ref: './paths/editions.yaml#/editionIssue'
  /api/editions/self/issues:
    $ref: './paths/editions.yaml#/issues'
  /api/editions/self/issues/{date}:
    $ref: './paths/editions.yaml#/issue'
  /api/articles/{id}/answers:
    $ref: './paths/answers.yaml#/collection'
  /api/conversations:
    $ref: './paths/conversations.yaml#/collection'
  /api/conversations/{id}:
    $ref: './paths/conversations.yaml#/item'
  /api/conversations/{id}/messages:
    $ref: './paths/conversations.yaml#/messages'
  /api/articles/{id}/emails:
    $ref: './paths/emails.yaml#/collection'
  /api/feeds:
    $ref: './paths/feeds.yaml#/collection'
  /api/feeds/{id}:
    $ref: './paths/feeds.yaml#/item'
  /api/feeds/imports:
    $ref: './paths/feeds.yaml#/imports'
  /api/feeds/{id}/refreshes:
    $ref: './paths/feeds.yaml#/retries'
  /api/feeds/{id}/statistics:
    $ref: './paths/feeds.yaml#/statistics'
  /api/feeds/suggestions:
    $ref: './paths/feeds.yaml#/suggestions'
  /api/feeds/refreshes:
    $ref: './paths/feeds.yaml#/refreshes'
  /api/feeds/moves:
    $ref: './paths/feeds.yaml#/moves'
  /api/feeds/removals:
    $ref: './paths/feeds.yaml#/removals'
  /api/push/configuration:
    $ref: './paths/push.yaml#/configuration'
  /api/sections:
    $ref: './paths/sections.yaml#/collection'
  /api/sections/{id}:
    $ref: './paths/sections.yaml#/item'
  /api/topics:
    $ref: './paths/topics.yaml#/collection'
  /api/sessions:
    $ref: './paths/sessions.yaml#/collection'
  /api/sessions/self:
    $ref: './paths/sessions.yaml#/self'
  /api/users/self/classifiers:
    $ref: './paths/classifiers.yaml#/collection'
  /api/users/self/classifiers/{id}:
    $ref: './paths/classifiers.yaml#/item'
  /api/users/self/searches:
    $ref: './paths/searches.yaml#/collection'
  /api/users/self/searches/{id}:
    $ref: './paths/searches.yaml#/item'
  /api/users/self/reads:
    $ref: './paths/reads.yaml#/collection'
  /api/users/self/preferences:
    $ref: './paths/preferences.yaml#/item'
  /api/users/self/reads/{article_id}:
    $ref: './paths/reads.yaml#/item'
  /api/users/self/saves:
    $ref: './paths/saves.yaml#/collection'
  /api/users/self/saves/{article_id}:
    $ref: './paths/saves.yaml#/item'
  /api/users/self/notifications/rules:
    $ref: './paths/notifications.yaml#/rules'
  /api/users/self/notifications/rules/{id}:
    $ref: './paths/notifications.yaml#/rule'
  /api/users/self/notifications/{feed_id}:
    $ref: './paths/notifications.yaml#/item'
  /api/users/self/push/subscriptions:
    $ref: './paths/push.yaml#/subscriptions'
  /api/users/self/push/subscriptions/{id}:
