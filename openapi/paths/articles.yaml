collection:
  get:
    operationId: searchArticles
    tags: [articles]
    summary: Search the archive of articles from the feeds the person follows, or list the most read or saved.
    description: >-
      Rate limited by the `RL_API` binding. Every edition is searched, newest article first (oldest first with `order=oldest`). Without `q` every article is listed.
      With a trending `order` the list is NewsBlur's: `reads` (well read) ranks by distinct readers then seconds spent, `read_time` by seconds spent in reads of three seconds or more, `long_reads` by the second-deepest read of a story of 600 words or more read through by two or more, `good_reads` by stories someone saved first and then the second-deepest read of 30 seconds or more on a story of 250 words or more (or four such readers), and `saves` by distinct savers.
      A story counts only once two or more people are behind it, so a count never points at one reader; only counts are shown, never who.
      The ranked list then shows each story once (by cluster and title), takes one story per feed, site and publisher and at most three of a topic in each block of twelve, and keeps any source to a tenth of the list.
      `q` and `feed_id` are refused with a trending order; the cursor is a place in the list.
    parameters:
      - name: q
        in: query
        description: Words every article must hold in its title, summary, text, author or tags. An `author:` or `tag:` term (quoted for several words, as `author:"Ada Lovelace"`) matches only that field, as NewsBlur's search does.
        schema:
          type: string
          maxLength: 200
      - name: feed_id
        in: query
        description: Only articles from this one feed, newest first. A feed the person does not follow lists nothing. Not with a trending order.
        schema:
          type: string
          pattern: '^[1-9][0-9]*$'
      - name: order
        in: query
        description: Newest or oldest first, or one of the trending rankings.
        schema:
          type: string
          enum:
            [newest, oldest, reads, read_time, long_reads, good_reads, saves]
          default: newest
      - name: window
        in: query
        description: How far back reads or saves count. Only with a trending order.
        schema:
          type: string
          enum: [day, week, month]
          default: week
      - name: read
        in: query
        description: '`false` leaves out the stories the person has read. Only with a trending order.'
        schema:
          type: string
          enum: ['false']
      - name: sort
        in: query
        description: '`oldest` serves a trending list from its end. Only with a trending order.'
        schema:
          type: string
          enum: [newest, oldest]
          default: newest
      - name: cursor
        in: query
        description: The opaque cursor from a previous page's `next`.
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    responses:
      '200':
        description: One page of articles.
        content:
          application/json:
            schema:
              $ref: '../components/article.yaml#/ArticlePage'
      '400':
        $ref: '../components/common.yaml#/responses/BadRequest'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
item:
  get:
    operationId: getArticle
    tags: [articles]
    summary: Read one article with its text.
    description: Rate limited by the `RL_API` binding. When the daily scrape did not fetch the article's text, it is fetched from the original page the first time it is asked for and kept; a page with less than 100 characters of text is kept as having none. An article from a source the person does not follow, or an id that cannot name one, is a 404.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^[1-9][0-9]{0,14}$'
    responses:
      '200':
        description: The article.
        content:
          application/json:
            schema:
              $ref: '../components/article.yaml#/ArticleDetail'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '404':
        $ref: '../components/common.yaml#/responses/NotFound'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
similar:
  get:
    operationId: listSimilarArticles
    tags: [articles]
    summary: List the stories most like one article.
    description: Rate limited by the `RL_API` binding. Stories that share the most words of the article's title, best first, never another copy of the same address. With `scope=followed` (the default), up to ten from the sources the person follows; with `scope=all` (discover), up to five from any source, each saying whether the person follows its source (follow one with `POST /api/feeds`). One page, with no `next`. An article from a source the person does not follow, or an id that cannot name one, is a 404.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^[1-9][0-9]{0,14}$'
      - name: scope
        in: query
        schema:
          type: string
          enum:
            - followed
            - all
          default: followed
    responses:
      '200':
        description: The similar stories.
        content:
          application/json:
            schema:
              type: object
              required: [self, items]
              properties:
                self:
                  type: string
                items:
                  type: array
                  items:
                    oneOf:
                      - $ref: '../components/article.yaml#/Article'
                      - $ref: '../components/article.yaml#/DiscoveredArticle'
      '400':
        $ref: '../components/common.yaml#/responses/BadRequest'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '404':
        $ref: '../components/common.yaml#/responses/NotFound'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
extractions:
  post:
    operationId: extractArticleText
    tags: [articles]
    summary: Fetch an article's text again from its page.
    description: Rate limited by the `RL_API` binding. The text is kept on the article, replacing what was there; an extraction is not stored apart from it, so the answer is the article and the status 200. When the article has no picture, the page's lead picture becomes its picture. An article from a source the person does not follow, or an id that cannot name one, is a 404.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^[1-9][0-9]{0,14}$'
    responses:
      '200':
        description: The article with its text as fetched now.
        content:
          application/json:
            schema:
              $ref: '../components/article.yaml#/ArticleDetail'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'
      '404':
        $ref: '../components/common.yaml#/responses/NotFound'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
