collection:
  get:
    operationId: listBriefings
    tags: [briefings]
    summary: List the person's briefings, newest first.
    description: Rate limited by the `RL_API` binding. Briefings are written on the person's schedule (see their preferences) and kept one per slot and local day.
    parameters:
      - $ref: '../components/common.yaml#/parameters/Cursor'
      - $ref: '../components/common.yaml#/parameters/Limit'
    responses:
      '200':
        description: One page of briefings.
        content:
          application/json:
            schema:
              $ref: '../components/briefing.yaml#/BriefingPage'
      '400':
        $ref: '../components/common.yaml#/responses/BadRequest'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
  post:
    operationId: writeBriefing
    tags: [briefings]
    summary: Write a briefing now, for the slot of the person's day they are in.
    description: Rate limited by the `RL_API` binding. Calls Workers AI. Too few stories in the window is a 404.
    responses:
      '200':
        description: The briefing, written again in place of that slot's.
        headers:
          Location:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: '../components/briefing.yaml#/Briefing'
      '201':
        description: The briefing.
        headers:
          Location:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: '../components/briefing.yaml#/Briefing'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'
      '404':
        $ref: '../components/common.yaml#/responses/NotFound'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
item:
  get:
    operationId: getBriefing
    tags: [briefings]
    summary: Read one of the person's briefings.
    description: Rate limited by the `RL_API` binding.
    parameters:
      - $ref: '../components/common.yaml#/parameters/Id'
    responses:
      '200':
        description: The briefing.
        content:
          application/json:
            schema:
              $ref: '../components/briefing.yaml#/Briefing'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '404':
        $ref: '../components/common.yaml#/responses/NotFound'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
audit:
  get:
    operationId: listEveryBriefing
    tags: [briefings]
    summary: List everyone's briefings, for an operator.
    description: Rate limited by the `RL_API` binding. Only a person whose email is in the `ADMIN_EMAILS` variable may list them; anyone else gets a 403.
    parameters:
      - $ref: '../components/common.yaml#/parameters/Cursor'
      - $ref: '../components/common.yaml#/parameters/Limit'
    responses:
      '200':
        description: One page of briefings.
        content:
          application/json:
            schema:
              $ref: '../components/briefing.yaml#/BriefingAuditPage'
      '400':
        $ref: '../components/common.yaml#/responses/BadRequest'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
