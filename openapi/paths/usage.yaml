item:
  get:
    operationId: getUsage
    tags: [usage]
    summary: Today's Ask AI and assistant budgets.
    description: Rate limited by the `RL_API` binding. Budgets reset at midnight UTC; cached answers do not count.
    responses:
      '200':
        description: The budgets.
        content:
          application/json:
            schema:
              $ref: '../components/conversation.yaml#/Usage'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
