collection:
  post:
    operationId: transcribe
    tags: [answers]
    summary: Turn a spoken question into text.
    description: Rate limited by the `RL_AI` binding, and by a daily budget (`GET /api/users/self/usage`) answered with 429 and `Retry-After` until midnight UTC. Transcribed by Workers AI's Whisper, for asking with `POST /api/articles/{id}/answers`; nothing is kept.
    requestBody:
      required: true
      content:
        audio/*:
          schema:
            type: string
            format: binary
            maxLength: 10485760
    responses:
      '200':
        description: What was heard.
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
      '413':
        description: The recording is over 10 MB.
        content:
          application/problem+json:
            schema:
              $ref: '../components/common.yaml#/schemas/Problem'
      '400':
        $ref: '../components/common.yaml#/responses/BadRequest'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'
      '415':
        $ref: '../components/common.yaml#/responses/UnsupportedMediaType'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
      '502':
        $ref: '../components/common.yaml#/responses/BadGateway'
