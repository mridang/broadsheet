collection:
  get:
    operationId: listConversations
    tags: [conversations]
    summary: The person's conversations, last active first, without their turns.
    description: Rate limited by the `RL_API` binding.
    parameters:
      - $ref: '../components/common.yaml#/parameters/Limit'
      - $ref: '../components/common.yaml#/parameters/Cursor'
    responses:
      '200':
        description: One page of conversations.
        content:
          application/json:
            schema:
              type: object
              required: [self, items]
              properties:
                self:
                  type: string
                next:
                  type: string
                items:
                  type: array
                  items:
                    $ref: '../components/conversation.yaml#/ConversationSummary'
      '400':
        $ref: '../components/common.yaml#/responses/BadRequest'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
  post:
    operationId: startConversation
    tags: [conversations]
    summary: Start a conversation with the archive assistant.
    description: Rate limited by the `RL_API` binding. Takes no body.
    responses:
      '201':
        description: The conversation, with no turns yet.
        headers:
          Location:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: '../components/conversation.yaml#/Conversation'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
item:
  parameters:
    - $ref: '#/ConversationId'
  get:
    operationId: getConversation
    tags: [conversations]
    summary: A conversation with its turns.
    description: Rate limited by the `RL_API` binding. Another person's conversation is a 404.
    responses:
      '200':
        description: The conversation.
        content:
          application/json:
            schema:
              $ref: '../components/conversation.yaml#/Conversation'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '404':
        $ref: '../components/common.yaml#/responses/NotFound'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
  delete:
    operationId: deleteConversation
    tags: [conversations]
    summary: Remove a conversation and its turns.
    description: Rate limited by the `RL_API` binding. Another person's conversation is a 404.
    responses:
      '204':
        description: The conversation is gone.
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'
      '404':
        $ref: '../components/common.yaml#/responses/NotFound'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
suggestions:
  get:
    operationId: listConversationSuggestions
    tags: [conversations]
    summary: Starter questions for the assistant.
    description: Rate limited by the `RL_API` binding. Drawn from the sources the person reads most and the tags they save under; at most six, as one page.
    responses:
      '200':
        description: The questions.
        content:
          application/json:
            schema:
              type: object
              required: [self, items]
              properties:
                self:
                  type: string
                items:
                  type: array
                  maxItems: 6
                  items:
                    type: string
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
messages:
  parameters:
    - $ref: '#/ConversationId'
  post:
    operationId: askAssistant
    tags: [conversations]
    summary: Ask the archive assistant a question.
    description: Rate limited by the `RL_AI` binding, and by a daily budget (`GET /api/users/self/usage`) answered with 429 and `Retry-After` until midnight UTC. The assistant searches the person's followed sources, saves and reads with tools (full-text search with a date range and source, saved stories by tag with their notes and highlights, a summary of the saves, stories readers shared with their comments, recent reads, one story in full, an archive summary) and cites the stories it used; it can cite only stories it was given. The first question titles the conversation. The question and the answer are both kept as turns; when the model fails nothing is kept.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/conversation.yaml#/MessageInput'
    responses:
      '201':
        description: The assistant's answer.
        headers:
          Location:
            description: The conversation the answer was added to.
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: '../components/conversation.yaml#/Message'
      '400':
        $ref: '../components/common.yaml#/responses/BadRequest'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'
      '404':
        $ref: '../components/common.yaml#/responses/NotFound'
      '415':
        $ref: '../components/common.yaml#/responses/UnsupportedMediaType'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
      '502':
        $ref: '../components/common.yaml#/responses/BadGateway'
ConversationId:
  name: id
  in: path
  required: true
  schema:
    type: string
    pattern: '^[1-9][0-9]{0,14}$'
