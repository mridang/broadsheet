collection:
  get:
    operationId: listRivers
    tags: [rivers]
    summary: List the rivers pinned to the person's front page.
    description: Rate limited by the `RL_API` binding. The left column, then the right, each in order. A person pins at most 20, so the list is one page.
    responses:
      '200':
        description: The rivers.
        content:
          application/json:
            schema:
              $ref: '../components/river.yaml#/RiverPage'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
  post:
    operationId: pinRiver
    tags: [rivers]
    summary: Pin a river at a place, or change what the river there lists.
    description: Rate limited by the `RL_API` binding. A river that lists something not the person's is a 400.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/river.yaml#/RiverInput'
    responses:
      '200':
        description: The river already at that place now lists this.
        headers:
          Location:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: '../components/river.yaml#/River'
      '201':
        description: The river is pinned.
        headers:
          Location:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: '../components/river.yaml#/River'
      '400':
        $ref: '../components/common.yaml#/responses/BadRequest'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'
      '415':
        $ref: '../components/common.yaml#/responses/UnsupportedMediaType'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
  put:
    operationId: replaceRivers
    tags: [rivers]
    summary: Replace every pinned river at once.
    description: Rate limited by the `RL_API` binding. A river that lists something not the person's, or two at one place, is a 400 and changes nothing.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/river.yaml#/RiverList'
    responses:
      '200':
        description: The rivers as they are now.
        content:
          application/json:
            schema:
              $ref: '../components/river.yaml#/RiverPage'
      '400':
        $ref: '../components/common.yaml#/responses/BadRequest'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'
      '415':
        $ref: '../components/common.yaml#/responses/UnsupportedMediaType'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
item:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[1-9][0-9]{0,14}$'
  delete:
    operationId: unpinRiver
    tags: [rivers]
    summary: Unpin a river; the ones below it in its column move up.
    description: Rate limited by the `RL_API` binding. A river that is not the person's is a 404.
    responses:
      '204':
        description: The river is gone.
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'
      '404':
        $ref: '../components/common.yaml#/responses/NotFound'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
