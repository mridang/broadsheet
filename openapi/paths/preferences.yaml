item:
  get:
    operationId: getPreferences
    tags: [preferences]
    summary: Read what the person chose about clustering and the editor's note.
    description: Rate limited by the `RL_API` binding. Defaults apply to whatever the person never changed.
    responses:
      '200':
        description: The person's preferences.
        headers:
          ETag:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: '../components/preferences.yaml#/Preferences'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
  patch:
    operationId: updatePreferences
    tags: [preferences]
    summary: Change some of the person's preferences.
    description: Rate limited by the `RL_API` binding. Members left out keep their value.
    parameters:
      - name: If-Match
        in: header
        description: The `ETag` of the preferences this change was made against.
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/preferences.yaml#/PreferenceChanges'
    responses:
      '200':
        description: All of the person's preferences, after the change.
        headers:
          ETag:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: '../components/preferences.yaml#/Preferences'
      '400':
        $ref: '../components/common.yaml#/responses/BadRequest'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'
      '412':
        $ref: '../components/common.yaml#/responses/PreconditionFailed'
      '415':
        $ref: '../components/common.yaml#/responses/UnsupportedMediaType'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
