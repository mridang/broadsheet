item:
  parameters:
    - $ref: '../components/common.yaml#/parameters/ArticleId'
  post:
    operationId: markRead
    tags: [reads]
    summary: Note that a story was opened.
    description: Rate limited by the `RL_API` binding. A read story is dimmed in its edition and left out of later ones. Noting it again answers 200.
    responses:
      '200':
        description: The story was read already.
        headers:
          Location:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: '#/Read'
      '201':
        description: The story is noted as read.
        headers:
          Location:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: '#/Read'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'
      '404':
        $ref: '../components/common.yaml#/responses/NotFound'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
  delete:
    operationId: markUnread
    tags: [reads]
    summary: Mark a story unread again.
    description: Rate limited by the `RL_API` binding. The story is no longer dimmed, and later editions may show it again.
    responses:
      '204':
        description: The story is unread.
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'
      '404':
        $ref: '../components/common.yaml#/responses/NotFound'
  patch:
    operationId: recordReadTime
    tags: [reads]
    summary: Note how long the person spent on a story they read.
    description: Rate limited by the `RL_API` binding. The longest time recorded stays; more than 1200 seconds counts as 1200. Trending ranks read time, long reads and good reads from it. A story with no read is a 404.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [seconds]
            properties:
              seconds:
                type: integer
                minimum: 0
    responses:
      '200':
        description: The read with the seconds now stored.
        content:
          application/json:
            schema:
              $ref: '#/Read'
      '400':
        $ref: '../components/common.yaml#/responses/BadRequest'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'
      '404':
        $ref: '../components/common.yaml#/responses/NotFound'
      '415':
        $ref: '../components/common.yaml#/responses/UnsupportedMediaType'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
collection:
  post:
    operationId: markManyRead
    tags: [reads]
    summary: Mark many stories read at once.
    description: Rate limited by the `RL_API` binding. As NewsBlur's mark-all, mark-feed and mark-stories read. The body names at least one member, each narrowing the rest; `before` as now marks every unread story in the person's feeds. Backs the mark-all, mark-above and mark-below shortcuts.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/ReadScope'
    responses:
      '200':
        description: The stories now read. Named `article_ids` that are not stories in the person's feeds are left out; without `article_ids`, only the stories this request marked.
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/Read'
      '400':
        $ref: '../components/common.yaml#/responses/BadRequest'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'
      '415':
        $ref: '../components/common.yaml#/responses/UnsupportedMediaType'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
Read:
  type: object
  required: [article_id]
  properties:
    article_id:
      type: string
    seconds:
      type: integer
      minimum: 0
      maximum: 1200
ReadScope:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    article_ids:
      type: array
      minItems: 1
      maxItems: 500
      items:
        type: string
        pattern: '^[1-9][0-9]{0,14}$'
    feed_ids:
      type: array
      minItems: 1
      maxItems: 500
      description: Only these feeds of the person's.
      items:
        type: string
        pattern: '^[1-9][0-9]{0,14}$'
    section_id:
      type: string
      pattern: '^[1-9][0-9]{0,14}$'
      description: Only the feeds filed under this section of the person's.
    edition:
      type: string
      format: date
    before:
      type: string
      format: date-time
      description: Only stories published before this time.
    after:
      type: string
      format: date-time
      description: Only stories published after this time.
