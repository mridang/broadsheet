collection:
  post:
    operationId: markManyRead
    tags: [reads]
    summary: Note many stories as read at once.
    description: Rate limited by the `RL_API` binding. Marks a whole edition, or the stories above or below one, read. Ids that are not stories in the person's feeds are left out of the answer.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [article_ids]
            properties:
              article_ids:
                type: array
                minItems: 1
                maxItems: 500
                items:
                  type: string
    responses:
      '200':
        description: The stories now read.
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/Read'
      '400':
        $ref: '../components/common.yaml#/responses/BadRequest'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
item:
  parameters:
    - $ref: '../components/common.yaml#/parameters/ArticleId'
  post:
    operationId: markRead
    tags: [reads]
    summary: Note that a story was opened.
    description: Rate limited by the `RL_API` binding. A read story is dimmed in its edition and left out of later ones. Noting it again answers 200.
    responses:
      '200':
        description: The story was read already.
        headers:
          Location:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: '#/Read'
      '201':
        description: The story is noted as read.
        headers:
          Location:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: '#/Read'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'
      '404':
        $ref: '../components/common.yaml#/responses/NotFound'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
  delete:
    operationId: markUnread
    tags: [reads]
    summary: Mark a story unread again.
    description: Rate limited by the `RL_API` binding. The story is no longer dimmed, and later editions may show it again.
    responses:
      '204':
        description: The story is unread.
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'
      '404':
        $ref: '../components/common.yaml#/responses/NotFound'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
Read:
  type: object
  required: [article_id]
  properties:
    article_id:
      type: string
