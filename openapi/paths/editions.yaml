issue:
  get:
    operationId: getIssue
    tags: [editions]
    summary: Read the paper the person was given on one day.
    description: Rate limited by the `RL_API` binding. `self` is the person's default edition. Issues are laid out by the daily run; a day it laid out none, or a date that is not a calendar date, is a 404.
    parameters:
      - name: date
        in: path
        required: true
        schema:
          type: string
          format: date
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
    responses:
      '200':
        description: The issue.
        content:
          application/json:
            schema:
              $ref: '../components/issue.yaml#/Issue'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '404':
        $ref: '../components/common.yaml#/responses/NotFound'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
collection:
  post:
    operationId: addEdition
    tags: [editions]
    summary: Add a custom edition, a named paper with its own rules.
    description: Rate limited by the `RL_API` binding. A section that is not the person's is a 400. The daily run lays out an issue of every edition.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../components/edition.yaml#/EditionChanges'
              - required: [name]
    responses:
      '201':
        description: The edition is added.
        headers:
          Location:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: '../components/edition.yaml#/Edition'
      '400':
        $ref: '../components/common.yaml#/responses/BadRequest'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'
      '415':
        $ref: '../components/common.yaml#/responses/UnsupportedMediaType'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
item:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[1-9][0-9]{0,14}$'
  patch:
    operationId: changeEdition
    tags: [editions]
    summary: Rename a custom edition or change its rules.
    description: Rate limited by the `RL_API` binding. Only the members sent are changed. An edition that is not the person's, or an id that cannot name one (such as `self`), is a 404.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/edition.yaml#/EditionChanges'
    responses:
      '200':
        description: The edition as it is now.
        content:
          application/json:
            schema:
              $ref: '../components/edition.yaml#/Edition'
      '400':
        $ref: '../components/common.yaml#/responses/BadRequest'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'
      '404':
        $ref: '../components/common.yaml#/responses/NotFound'
      '415':
        $ref: '../components/common.yaml#/responses/UnsupportedMediaType'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
  delete:
    operationId: removeEdition
    tags: [editions]
    summary: Remove a custom edition and the issues it printed.
    description: Rate limited by the `RL_API` binding. An edition that is not the person's, or an id that cannot name one (such as `self`), is a 404.
    responses:
      '204':
        description: The edition is gone.
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'
      '404':
        $ref: '../components/common.yaml#/responses/NotFound'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
editionIssue:
  get:
    operationId: getEditionIssue
    tags: [editions]
    summary: Read the paper one of the person's custom editions printed on one day.
    description: Rate limited by the `RL_API` binding. An edition that is not the person's, a day the daily run laid out no issue of it, or a date that is not a calendar date, is a 404.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^[1-9][0-9]{0,14}$'
      - name: date
        in: path
        required: true
        schema:
          type: string
          format: date
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
    responses:
      '200':
        description: The issue.
        content:
          application/json:
            schema:
              $ref: '../components/issue.yaml#/Issue'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '404':
        $ref: '../components/common.yaml#/responses/NotFound'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
