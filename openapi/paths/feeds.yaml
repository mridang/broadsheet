collection:
  get:
    operationId: listFeeds
    tags: [feeds]
    summary: List the feeds the person follows, as JSON or OPML.
    description: Answers JSON by default and OPML when the request sends `Accept` `text/x-opml`, with sections as folders. The OPML form is the whole list; the JSON form is a cursor page. Rate limited by the `RL_API` binding.
    parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        schema:
          type: string
    responses:
      '200':
        description: The feeds.
        headers:
          Vary:
            schema:
              type: string
        content:
          application/json:
            schema:
              type: object
              required: [self, items]
              properties:
                self:
                  type: string
                next:
                  type: string
                items:
                  type: array
                  items:
                    $ref: '../components/feed.yaml#/Feed'
          text/x-opml:
            schema:
              type: string
      '400':
        $ref: '../components/common.yaml#/responses/BadRequest'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
  post:
    operationId: followFeed
    tags: [feeds]
    summary: Follow a feed.
    description: Rate limited by the `RL_API` binding. The address may be a page, in which case the feed it declares or links to, or one at a usual path, is followed instead, and an address that is a page with no feed to be found is a 400. The first edition of a new feed is fetched in the background.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [url]
            properties:
              url:
                type: string
                description: An http(s) address, at most 2048 characters.
    responses:
      '200':
        description: The person already follows this address.
        headers:
          Location:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: '../components/feed.yaml#/Feed'
      '201':
        description: The feed is now followed.
        headers:
          Location:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: '../components/feed.yaml#/Feed'
      '400':
        $ref: '../components/common.yaml#/responses/BadRequest'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'
      '415':
        $ref: '../components/common.yaml#/responses/UnsupportedMediaType'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
item:
  patch:
    operationId: changeFeed
    tags: [feeds]
    summary: Rename, mute (for good or for a time), reorder or file a feed under a section.
    description: Rate limited by the `RL_API` binding. Only the members sent are changed. A `section_id` that is not one of the person's sections is a 400. An id that cannot name a feed is a 404. A new `url` is refused with 409 when the person already follows it.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^[1-9][0-9]{0,14}$'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/feed.yaml#/FeedChanges'
    responses:
      '200':
        description: The feed as it is now.
        content:
          application/json:
            schema:
              $ref: '../components/feed.yaml#/Feed'
      '400':
        $ref: '../components/common.yaml#/responses/BadRequest'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'
      '404':
        $ref: '../components/common.yaml#/responses/NotFound'
      '409':
        description: The person already follows a feed at the new `url`.
        content:
          application/problem+json:
            schema:
              $ref: '../components/common.yaml#/schemas/Problem'
      '415':
        $ref: '../components/common.yaml#/responses/UnsupportedMediaType'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
  delete:
    operationId: unfollowFeed
    tags: [feeds]
    summary: Stop following a feed.
    description: Rate limited by the `RL_API` binding. An id that cannot name a feed is a 404.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^[1-9][0-9]{0,14}$'
    responses:
      '204':
        description: The feed is no longer followed.
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'
      '404':
        $ref: '../components/common.yaml#/responses/NotFound'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
refreshes:
  post:
    operationId: refreshFeeds
    tags: [feeds]
    summary: Fetch every feed the person follows again now.
    description: A refresh is not stored, so the result is the response and the answer is 200, not 201. Rate limited by the `RL_API` binding.
    responses:
      '200':
        description: How many feeds there were and how many refreshed or failed.
        content:
          application/json:
            schema:
              type: object
              required: [feeds, refreshed, failed]
              properties:
                feeds:
                  type: integer
                refreshed:
                  type: integer
                failed:
                  type: integer
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
imports:
  post:
    operationId: importFeeds
    tags: [feeds]
    summary: Follow many feeds at once from an OPML file or from topics.
    description: Folders in an OPML file become sections, nested folders nested sections (to 8 levels), as do the topics. A feed counts as already followed when its address (ignoring scheme, `www.` and a trailing slash) or its `htmlUrl` matches one the person follows, or when it carries the name (ignoring case) of one they follow. A feed's name from the file becomes the person's own name for it when the feed is known under another. Feeds already followed are skipped and invalid ones rejected, neither failing the request. Rate limited by the `RL_API` binding.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [topic_ids]
            properties:
              topic_ids:
                type: array
                minItems: 1
                maxItems: 50
                items:
                  type: string
        text/x-opml:
          schema:
            type: string
            maxLength: 1048576
            description: An OPML document of at most 1 MiB and 500 feeds. `text/xml` and `application/xml` are accepted too.
    responses:
      '201':
        description: The import ran.
        headers:
          Location:
            description: The feeds list.
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: '../components/feed.yaml#/ImportSummary'
      '400':
        $ref: '../components/common.yaml#/responses/BadRequest'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'
      '413':
        description: The body is over the size limit.
        content:
          application/problem+json:
            schema:
              $ref: '../components/common.yaml#/schemas/Problem'
      '415':
        $ref: '../components/common.yaml#/responses/UnsupportedMediaType'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
statistics:
  get:
    operationId: getFeedStatistics
    tags: [feeds]
    summary: How a feed is doing.
    description: Rate limited by the `RL_API` binding. An id that cannot name a feed is a 404.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^[1-9][0-9]{0,14}$'
    responses:
      '200':
        description: The feed's last fetch, last error, failures in a row and recent output.
        content:
          application/json:
            schema:
              $ref: '../components/feed.yaml#/FeedStatistics'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'
      '404':
        $ref: '../components/common.yaml#/responses/NotFound'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
suggestions:
  get:
    operationId: listFeedSuggestions
    tags: [feeds]
    summary: Sources other readers follow alongside the person's own.
    description: Rate limited by the `RL_API` binding. Co-subscription, most shared first, leaving out sources the person follows already; at most ten, as one page. Follow one with `POST /api/feeds` and its `url`.
    responses:
      '200':
        description: The suggestions.
        content:
          application/json:
            schema:
              type: object
              required: [self, items]
              properties:
                self:
                  type: string
                items:
                  type: array
                  maxItems: 10
                  items:
                    $ref: '../components/feed.yaml#/FeedSuggestion'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
retries:
  post:
    operationId: retryFeed
    tags: [feeds]
    summary: Fetch one feed again now, forgetting its failures.
    description: The way out of a broken feed. A refresh is not stored, so the result is the response. Rate limited by the `RL_API` binding.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^[1-9][0-9]{0,14}$'
    responses:
      '200':
        description: The feed fetched; its statistics as they are now.
        content:
          application/json:
            schema:
              $ref: '../components/feed.yaml#/FeedStatistics'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'
      '404':
        $ref: '../components/common.yaml#/responses/NotFound'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
      '502':
        description: The feed could not be fetched; the detail says why.
        content:
          application/problem+json:
            schema:
              $ref: '../components/common.yaml#/schemas/Problem'
moves:
  post:
    operationId: moveFeeds
    tags: [feeds]
    summary: File several feeds under one section at once.
    description: As NewsBlur moves a selection of feeds into a folder. Their other sections stay. Ids that are not the person's are skipped. A move is not stored, so the result is the response and the answer is 200. Rate limited by the `RL_API` binding.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [feed_ids, section_id]
            properties:
              feed_ids:
                type: array
                minItems: 1
                maxItems: 500
                items:
                  type: string
                  pattern: '^[1-9][0-9]{0,14}$'
              section_id:
                type: [string, 'null']
                pattern: '^[1-9][0-9]{0,14}$'
                description: One of the person's sections, or null for none.
    responses:
      '200':
        description: How many feeds moved.
        content:
          application/json:
            schema:
              type: object
              required: [moved]
              properties:
                moved:
                  type: integer
      '400':
        $ref: '../components/common.yaml#/responses/BadRequest'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'
      '415':
        $ref: '../components/common.yaml#/responses/UnsupportedMediaType'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
removals:
  post:
    operationId: removeFeeds
    tags: [feeds]
    summary: Stop following several feeds at once.
    description: Ids that are not the person's are skipped. A removal is not stored, so the result is the response and the answer is 200. Rate limited by the `RL_API` binding.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [feed_ids]
            properties:
              feed_ids:
                type: array
                minItems: 1
                maxItems: 500
                items:
                  type: string
                  pattern: '^[1-9][0-9]{0,14}$'
    responses:
      '200':
        description: How many feeds were removed.
        content:
          application/json:
            schema:
              type: object
              required: [removed]
              properties:
                removed:
                  type: integer
      '400':
        $ref: '../components/common.yaml#/responses/BadRequest'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'
      '415':
        $ref: '../components/common.yaml#/responses/UnsupportedMediaType'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
similar:
  get:
    operationId: listSimilarFeeds
    tags: [feeds]
    summary: Sources like one of the person's feeds.
    description: Rate limited by the `RL_API` binding. Sources that people who follow this feed's source also follow, and the person does not, most shared first, each with its newest headlines; at most five, as one page. Another person's feed is a 404.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^[1-9][0-9]{0,14}$'
    responses:
      '200':
        description: The similar sources.
        content:
          application/json:
            schema:
              type: object
              required: [self, items]
              properties:
                self:
                  type: string
                items:
                  type: array
                  maxItems: 5
                  items:
                    $ref: '../components/feed.yaml#/SimilarFeed'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '404':
        $ref: '../components/common.yaml#/responses/NotFound'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
