collection:
  get:
    operationId: listSaves
    tags: [saves]
    summary: List the saved stories, newest save first.
    description: Rate limited by the `RL_API` binding.
    parameters:
      - name: q
        in: query
        description: Only the stories matching these words as `GET /api/articles` matches `q`; a `tag:` term also matches the person's own tags on the save.
        schema:
          type: string
          maxLength: 200
      - name: tag
        in: query
        description: Only the stories saved with this tag; empty for every one.
        schema:
          type: string
      - name: feed_id
        in: query
        description: Only the stories saved from this feed. A feed the person does not follow is a 400.
        schema:
          type: string
          pattern: '^[1-9][0-9]{0,14}$'
      - $ref: '../components/common.yaml#/parameters/Limit'
      - $ref: '../components/common.yaml#/parameters/Cursor'
    responses:
      '200':
        description: One page of saved stories.
        content:
          application/json:
            schema:
              $ref: '../components/save.yaml#/SavePage'
      '400':
        $ref: '../components/common.yaml#/responses/BadRequest'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
item:
  parameters:
    - $ref: '../components/common.yaml#/parameters/ArticleId'
  post:
    operationId: saveStory
    tags: [saves]
    summary: Save a story with tags, notes and highlights, keeping it after its edition is replaced.
    description: Rate limited by the `RL_API` binding. The body may be left out. Saving a story again replaces its tags, and its notes and highlights when sent, and answers 200.
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../components/save.yaml#/SaveInput'
    responses:
      '200':
        description: The story was saved already; its tags are now the ones sent.
        headers:
          Location:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: '../components/save.yaml#/Save'
      '201':
        description: The story is saved.
        headers:
          Location:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: '../components/save.yaml#/Save'
      '400':
        $ref: '../components/common.yaml#/responses/BadRequest'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'
      '404':
        $ref: '../components/common.yaml#/responses/NotFound'
      '415':
        $ref: '../components/common.yaml#/responses/UnsupportedMediaType'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
  delete:
    operationId: unsaveStory
    tags: [saves]
    summary: Stop keeping a saved story.
    description: Rate limited by the `RL_API` binding.
    responses:
      '204':
        description: The save is gone.
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'
      '404':
        $ref: '../components/common.yaml#/responses/NotFound'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
tags:
  get:
    operationId: listSaveTags
    tags: [saves]
    summary: List the tags on the saved stories, each with how many saves carry it.
    description: Rate limited by the `RL_API` binding.
    responses:
      '200':
        description: Every tag, by name.
        content:
          application/json:
            schema:
              $ref: '../components/save.yaml#/SaveTagList'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
tag:
  parameters:
    - name: name
      in: path
      required: true
      description: The tag, percent-encoded.
      schema:
        type: string
  patch:
    operationId: renameSaveTag
    tags: [saves]
    summary: Rename a tag on every save carrying it.
    description: Rate limited by the `RL_API` binding. Renaming to a tag a save already has merges the two.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/save.yaml#/SaveTagRename'
    responses:
      '200':
        description: The tag as it is now.
        content:
          application/json:
            schema:
              $ref: '../components/save.yaml#/SaveTag'
      '400':
        $ref: '../components/common.yaml#/responses/BadRequest'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'
      '404':
        $ref: '../components/common.yaml#/responses/NotFound'
      '415':
        $ref: '../components/common.yaml#/responses/UnsupportedMediaType'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
  delete:
    operationId: deleteSaveTag
    tags: [saves]
    summary: Take a tag off every save; the saves stay.
    description: Rate limited by the `RL_API` binding.
    responses:
      '204':
        description: No save carries the tag now.
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'
      '404':
        $ref: '../components/common.yaml#/responses/NotFound'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
feeds:
  get:
    operationId: listSaveFeeds
    tags: [saves]
    summary: Count the saved stories from each of the person's feeds.
    description: Rate limited by the `RL_API` binding. Feeds with no saves are left out.
    responses:
      '200':
        description: Each feed's count.
        content:
          application/json:
            schema:
              $ref: '../components/save.yaml#/SaveFeedList'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
