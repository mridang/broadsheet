collection:
  delete:
    operationId: endAllSessions
    tags: [sessions]
    summary: Sign out everywhere.
    description: Ends every session of the signed-in person on every device and clears this browser's cookie. Rate limited by the `RL_API` binding.
    responses:
      '204':
        description: Every session has been ended.
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
self:
  delete:
    operationId: endOwnSession
    tags: [sessions]
    summary: Sign out.
    description: Clears the session cookie. Idempotent, and does not need a login, so signing out twice is fine. Rate limited by the `RL_AUTH` binding.
    security: []
    responses:
      '204':
        description: The session cookie is cleared.
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
