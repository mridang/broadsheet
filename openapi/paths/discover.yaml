trending:
  get:
    operationId: listTrendingFeeds
    tags: [discover]
    summary: Trending sources.
    description: Rate limited by the `RL_API` binding. After NewsBlur's trending sites. `popular` has the most followers; `rising` gained the most followers for its size in the window; `hidden` gems have at most 50 followers but the most reads and saves per follower in the window; `new` arrivals were first followed in the window. One page.
    parameters:
      - name: kind
        in: query
        description: popular (the default), rising, hidden or new.
        schema:
          type: string
          enum: [popular, rising, hidden, new]
      - name: days
        in: query
        description: The window, in days.
        schema:
          type: integer
          minimum: 1
          maximum: 90
          default: 7
      - $ref: '../components/common.yaml#/parameters/Limit'
    responses:
      '200':
        description: The sources.
        content:
          application/json:
            schema:
              type: object
              required: [self, items]
              properties:
                self:
                  type: string
                items:
                  type: array
                  items:
                    $ref: '../components/discover.yaml#/RankedSource'
      '400':
        $ref: '../components/common.yaml#/responses/BadRequest'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
podcasts:
  get:
    operationId: searchPodcasts
    tags: [discover]
    summary: Search podcasts, with their feeds.
    description: Rate limited by the `RL_API` binding. Found by the iTunes Search API; podcasts without a feed are left out. One page.
    parameters:
      - name: q
        in: query
        required: true
        description: What to search for.
        schema:
          type: string
      - $ref: '../components/common.yaml#/parameters/Limit'
    responses:
      '200':
        description: The podcasts.
        content:
          application/json:
            schema:
              type: object
              required: [self, items]
              properties:
                self:
                  type: string
                items:
                  type: array
                  items:
                    $ref: '../components/discover.yaml#/Podcast'
      '400':
        $ref: '../components/common.yaml#/responses/BadRequest'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
      '502':
        $ref: '../components/common.yaml#/responses/BadGateway'
subreddits:
  get:
    operationId: searchSubreddits
    tags: [discover]
    summary: Search subreddits, or list the popular ones, with their feeds.
    description: Rate limited by the `RL_API` binding. Found by Reddit's public listings; subreddits marked for adults are left out. Without `q`, Reddit's popular subreddits. One page.
    parameters:
      - name: q
        in: query
        description: What to search for; leave out for the popular ones.
        schema:
          type: string
      - $ref: '../components/common.yaml#/parameters/Limit'
    responses:
      '200':
        description: The subreddits.
        content:
          application/json:
            schema:
              type: object
              required: [self, items]
              properties:
                self:
                  type: string
                items:
                  type: array
                  items:
                    $ref: '../components/discover.yaml#/Subreddit'
      '400':
        $ref: '../components/common.yaml#/responses/BadRequest'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
      '502':
        $ref: '../components/common.yaml#/responses/BadGateway'
conversions:
  post:
    operationId: convertToFeed
    tags: [discover]
    summary: Find the feed of an address, or build a Google News feed.
    description: Rate limited by the `RL_API` binding. After NewsBlur's newsletter conversion and Google News feeds. Nothing is kept or followed; follow the result with `POST /api/feeds`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/discover.yaml#/ConversionInput'
    responses:
      '200':
        description: The feed found.
        content:
          application/json:
            schema:
              $ref: '../components/discover.yaml#/Conversion'
      '400':
        $ref: '../components/common.yaml#/responses/BadRequest'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'
      '415':
        $ref: '../components/common.yaml#/responses/UnsupportedMediaType'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
newsTopics:
  get:
    operationId: listNewsTopics
    tags: [discover]
    summary: The Google News topics a feed can follow.
    description: Rate limited by the `RL_API` binding. Use an `id` as `google_news.topic` in `POST /api/feeds/conversions`. One page.
    responses:
      '200':
        description: The topics.
        content:
          application/json:
            schema:
              type: object
              required: [self, items]
              properties:
                self:
                  type: string
                items:
                  type: array
                  items:
                    $ref: '../components/discover.yaml#/NewsTopic'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
recommendations:
  get:
    operationId: listFeedRecommendations
    tags: [discover]
    summary: Feeds put forward for everyone.
    description: Rate limited by the `RL_API` binding. Approved ones by default, last approved first; the first is the feed of the day. Only a curator (an address in `CURATOR_EMAILS`) may list `pending` or `declined` ones. One page.
    parameters:
      - name: status
        in: query
        description: approved (the default), pending or declined.
        schema:
          type: string
          enum: [approved, pending, declined]
    responses:
      '200':
        description: The recommendations.
        content:
          application/json:
            schema:
              type: object
              required: [self, items]
              properties:
                self:
                  type: string
                items:
                  type: array
                  items:
                    $ref: '../components/discover.yaml#/Recommendation'
      '400':
        $ref: '../components/common.yaml#/responses/BadRequest'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
  post:
    operationId: recommendFeed
    tags: [discover]
    summary: Put a feed forward for everyone.
    description: Rate limited by the `RL_API` binding. The recommendation waits for a curator.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/discover.yaml#/RecommendationInput'
    responses:
      '201':
        description: The recommendation, pending.
        headers:
          Location:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: '../components/discover.yaml#/Recommendation'
      '400':
        $ref: '../components/common.yaml#/responses/BadRequest'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'
      '415':
        $ref: '../components/common.yaml#/responses/UnsupportedMediaType'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
recommendation:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[1-9][0-9]{0,14}$'
  patch:
    operationId: decideFeedRecommendation
    tags: [discover]
    summary: Approve or decline a recommendation.
    description: Rate limited by the `RL_API` binding. Curators only.
    requestBody:
      required: true
      content:
        application/merge-patch+json:
          schema:
            type: object
            required: [status]
            additionalProperties: false
            properties:
              status:
                type: string
                enum: [approved, declined]
    responses:
      '200':
        description: The recommendation as decided.
        content:
          application/json:
            schema:
              $ref: '../components/discover.yaml#/Recommendation'
      '400':
        $ref: '../components/common.yaml#/responses/BadRequest'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'
      '404':
        $ref: '../components/common.yaml#/responses/NotFound'
      '415':
        $ref: '../components/common.yaml#/responses/UnsupportedMediaType'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
