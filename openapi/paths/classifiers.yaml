collection:
  get:
    operationId: listClassifiers
    tags: [classifiers]
    summary: List the classifiers that train the paper, newest first.
    description: Rate limited by the `RL_API` binding.
    parameters:
      - $ref: '../components/common.yaml#/parameters/Limit'
      - $ref: '../components/common.yaml#/parameters/Cursor'
    responses:
      '200':
        description: One page of classifiers.
        content:
          application/json:
            schema:
              $ref: '../components/classifier.yaml#/ClassifierPage'
      '400':
        $ref: '../components/common.yaml#/responses/BadRequest'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
  post:
    operationId: addClassifier
    tags: [classifiers]
    summary: Like or dislike stories by author, source, title phrase or tag.
    description: Rate limited by the `RL_API` binding. Sending a kind and value already trained replaces its score and answers 200.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/classifier.yaml#/ClassifierInput'
    responses:
      '200':
        description: The classifier was there already; its score is now the one sent.
        headers:
          Location:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: '../components/classifier.yaml#/Classifier'
      '201':
        description: The classifier is added.
        headers:
          Location:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: '../components/classifier.yaml#/Classifier'
      '400':
        $ref: '../components/common.yaml#/responses/BadRequest'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'
      '415':
        $ref: '../components/common.yaml#/responses/UnsupportedMediaType'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
item:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[1-9][0-9]{0,14}$'
  delete:
    operationId: removeClassifier
    tags: [classifiers]
    summary: Forget a classifier.
    description: Rate limited by the `RL_API` binding. An id that cannot name a classifier is a 404.
    responses:
      '204':
        description: The classifier is gone.
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'
      '404':
        $ref: '../components/common.yaml#/responses/NotFound'
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'
