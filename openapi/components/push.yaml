PushConfiguration:
  type: object
  required: [vapid_public_key]
  properties:
    vapid_public_key:
      type: string
      description: The uncompressed P-256 public key, base64url.
PushSubscriptionInput:
  type: object
  additionalProperties: false
  required: [endpoint, keys]
  properties:
    endpoint:
      type: string
      format: uri
      pattern: '^https://'
    expiration_time:
      type: [number, 'null']
    expirationTime:
      type: [number, 'null']
      description: As the browser names it; ignored.
    keys:
      type: object
      required: [p256dh, auth]
      properties:
        p256dh:
          type: string
        auth:
          type: string
PushSubscription:
  type: object
  required: [id, endpoint]
  properties:
    id:
      type: string
    endpoint:
      type: string
      format: uri
    created_at:
      type: string
      format: date-time
