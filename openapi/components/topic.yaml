Topic:
  type: object
  required: [id, name, description, feeds]
  properties:
    id:
      type: string
    name:
      type: string
    description:
      type: string
    feeds:
      type: array
      items:
        type: object
        required: [title, url]
        properties:
          title:
            type: string
          url:
            type: string
