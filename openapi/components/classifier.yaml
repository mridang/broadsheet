Classifier:
  type: object
  required: [id, kind, value, score]
  properties:
    id:
      type: string
    kind:
      $ref: '#/ClassifierKind'
    value:
      type: string
      description: The author, source (the site a story is from), phrase in the title, tag, or phrase in the summary or text (`text`) to match, ignoring case; for `feed`, the id of the feed's source, as a string.
    score:
      $ref: '#/ClassifierScore'
    created_at:
      type: string
      format: date-time
ClassifierKind:
  type: string
  enum: [author, source, title, tag, text, feed]
ClassifierScore:
  type: string
  enum: [like, dislike, super_dislike]
  description: Liked stories are promoted toward the lead and features; disliked ones leave the paper. A like wins over a dislike; a super_dislike wins over a like.
ClassifierInput:
  type: object
  additionalProperties: false
  required: [kind, value, score]
  properties:
    kind:
      $ref: '#/ClassifierKind'
    value:
      type: string
      minLength: 1
      maxLength: 200
    score:
      $ref: '#/ClassifierScore'
ClassifierPage:
  type: object
  required: [self, items]
  properties:
    self:
      type: string
      format: uri
    next:
      type: string
      format: uri
    items:
      type: array
      items:
        $ref: '#/Classifier'
