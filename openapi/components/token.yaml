FeedTokenInput:
  type: object
  additionalProperties: false
  required: [scope]
  properties:
    scope:
      type: string
      enum: [saves, section, edition]
    tag:
      type: string
      minLength: 1
      description: Only with `saves`, narrowing the feed to stories with this tag.
    section_id:
      type: string
      pattern: '^[1-9][0-9]{0,14}$'
      description: Required with `section`, and only allowed with it.
FeedToken:
  type: object
  required: [id, scope]
  properties:
    id:
      type: string
    scope:
      type: string
      enum: [saves, section, edition]
    tag:
      type: string
    section_id:
      type: string
    token:
      type: string
      description: Only in the answer that made the token.
    feed_url:
      type: string
      format: uri
      description: The `/feed.xml` address the token opens. Only in the answer that made the token.
    created_at:
      type: string
      format: date-time
