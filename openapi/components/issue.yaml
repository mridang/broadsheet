Issue:
  type: object
  required: [date, sections]
  properties:
    date:
      type: string
      format: date
    briefing:
      type: string
      description: The editor's note on the top stories, when one was written.
    briefing_stories:
      type: array
      description: The stories the note covers, in the order it covers them, and why each was picked.
      items:
        $ref: '#/BriefedStory'
    sections:
      type: array
      description: The paper's sections in print order; the desks filed under no section come first, in one with no name.
      items:
        $ref: '#/IssueSection'
    created_at:
      type: string
      format: date-time
IssueSection:
  type: object
  required: [desks]
  properties:
    name:
      type: string
    desks:
      type: array
      items:
        $ref: '#/IssueDesk'
IssueDesk:
  type: object
  required: [feed_id, title, url, stories]
  properties:
    feed_id:
      type: string
    title:
      type: string
    url:
      type: string
      format: uri
    stories:
      type: array
      description: The desk's stories in print order.
      items:
        $ref: '#/IssueStory'
IssueStory:
  type: object
  required: [article_id, tier, also_covered_by]
  properties:
    article_id:
      type: string
    tier:
      type: string
      enum: [lead, feature, standard, brief]
    also_covered_by:
      type: array
      description: The other sources that covered the same story, which print once.
      items:
        type: string
    covered_by:
      type: array
      description: The other copies of the story folded into this one.
      items:
        $ref: '#/IssueSibling'
IssueSibling:
  type: object
  required: [article_id, source, url, match]
  properties:
    article_id:
      type: string
    source:
      type: string
    url:
      type: string
      format: uri
    match:
      type: string
      enum: [title, related]
      description: '`title` when the headlines match, `related` when only the meaning does.'
BriefedStory:
  type: object
  required: [article_id, category]
  properties:
    article_id:
      type: string
    category:
      type: string
      enum:
        - widely_covered
        - infrequent
        - follow_up
        - classifier_match
        - long_read
        - top_stories

IssueSummary:
  type: object
  required: [date]
  properties:
    date:
      type: string
      format: date
    briefing:
      type: string
    created_at:
      type: string
      format: date-time
IssuePage:
  type: object
  required: [self, items]
  properties:
    self:
      type: string
      description: This page.
    next:
      type: string
      description: The following page. Absent on the last page.
    items:
      type: array
      items:
        $ref: '#/IssueSummary'
IssueRequest:
  type: object
  additionalProperties: false
  required: [date]
  properties:
    date:
      type: string
      format: date
