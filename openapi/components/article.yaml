Article:
  type: object
  required: [id, url, points]
  properties:
    id:
      type: string
    url:
      type: string
      description: The original article.
    title:
      type: string
    source:
      type: string
      description: The publisher's name.
    image:
      type: string
    summary:
      type: string
    published_at:
      type: string
      format: date-time
    edition:
      type: string
      format: date
      description: The day the article was scraped. Every edition is kept.
    points:
      type: integer
      minimum: 0
ArticleDetail:
  allOf:
    - $ref: '#/Article'
    - type: object
      properties:
        body_text:
          type: string
          description: The readable text of the article's page, blocks separated by a blank line. Absent when the page was not fetched or held no text.
        original_summary:
          type: string
          description: The summary the story first had, when a later fetch of its feed changed it; `summary` is the latest. Absent when it never changed.
ArticlePage:
  type: object
  required: [self, items]
  properties:
    self:
      type: string
      description: This page.
    next:
      type: string
      description: The following page. Absent on the last page.
    items:
      type: array
      items:
        $ref: '#/TrendingArticle'
TrendingArticle:
  description: An article in a list. Ranked by a trending order, it carries its count in the window; only the count, never who. `read_count` comes with `reads`, `long_reads` and `good_reads`, `save_count` with `saves`, and `read_seconds` with `read_time`.
  allOf:
    - $ref: '#/Article'
    - type: object
      properties:
        read_count:
          type: integer
          minimum: 2
        save_count:
          type: integer
          minimum: 2
        read_seconds:
          type: integer
          minimum: 0
DiscoveredArticle:
  allOf:
    - $ref: '#/Article'
  type: object
  required: [source_url, followed]
  properties:
    source_url:
      type: string
      format: uri
    followed:
      type: boolean
      description: Whether the person follows the story's source; follow it with `POST /api/feeds`.
