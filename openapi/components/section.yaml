Section:
  type: object
  required: [id, name, position]
  properties:
    id:
      type: string
    name:
      type: string
    position:
      type: integer
      minimum: 0
      description: Sections go down the front page in this order, among the sections that share a parent.
    parent_id:
      type: string
      description: The section this one nests under; absent at the top level. A nested section's feeds print under a heading that names the sections it is in, and an edition that prints a section prints the sections inside it too.
    icon:
      $ref: './icon.yaml#/Icon'
    auto_mark_read_days:
      $ref: './icon.yaml#/AutoMarkReadDays'
    created_at:
      type: string
      format: date-time
SectionChanges:
  type: object
  additionalProperties: false
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 200
    position:
      type: integer
      minimum: 0
      maximum: 10000
    parent_id:
      type: [string, 'null']
      pattern: '^[1-9][0-9]{0,14}$'
      description: One of the person's sections to nest under, or null for the top level. The section itself, or one inside it, is refused with 400.
    icon:
      oneOf:
        - $ref: './icon.yaml#/Icon'
        - type: 'null'
    auto_mark_read_days:
      oneOf:
        - $ref: './icon.yaml#/AutoMarkReadDays'
        - type: 'null'
