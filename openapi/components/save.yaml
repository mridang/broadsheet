Save:
  type: object
  required: [article_id, url, tags]
  properties:
    article_id:
      type: string
    url:
      type: string
      format: uri
    title:
      type: string
    source:
      type: string
    tags:
      type: array
      items:
        type: string
    saved_at:
      type: string
      format: date-time
    notes:
      type: string
      description: The person's own note on the story; absent when none.
    highlights:
      type: array
      description: Passages the person marked; absent when none.
      items:
        type: string
SaveInput:
  type: object
  additionalProperties: false
  properties:
    tags:
      type: array
      maxItems: 20
      uniqueItems: true
      items:
        type: string
        minLength: 1
        maxLength: 50
    notes:
      type: [string, 'null']
      maxLength: 5000
      description: Left out keeps the notes; null or blank clears them.
    highlights:
      type: array
      maxItems: 50
      description: Left out keeps the highlights.
      items:
        type: string
        minLength: 1
        maxLength: 1000
SavePage:
  type: object
  required: [self, items]
  properties:
    self:
      type: string
      format: uri
    next:
      type: string
      format: uri
    items:
      type: array
      items:
        $ref: '#/Save'
SaveTag:
  type: object
  required: [name, count]
  properties:
    name:
      type: string
    count:
      type: integer
      minimum: 1
      description: How many saves carry the tag.
SaveTagList:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '#/SaveTag'
SaveTagRename:
  type: object
  additionalProperties: false
  required: [name]
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 50
SaveFeedCount:
  type: object
  required: [feed_id, count]
  properties:
    feed_id:
      type: string
    count:
      type: integer
      minimum: 1
SaveFeedList:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '#/SaveFeedCount'
