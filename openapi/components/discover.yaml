RankedSource:
  type: object
  required: [url, followers, followed]
  properties:
    url:
      type: string
      format: uri
    title:
      type: string
    followers:
      type: integer
    followed:
      type: boolean
      description: Whether the person asking follows it.
Podcast:
  type: object
  required: [name, feed_url]
  properties:
    name:
      type: string
    author:
      type: string
    artwork:
      type: string
      format: uri
    feed_url:
      type: string
      format: uri
    genre:
      type: string
    episodes:
      type: integer
    link:
      type: string
      format: uri
Subreddit:
  type: object
  required: [name, feed_url, link]
  properties:
    name:
      type: string
    title:
      type: string
    description:
      type: string
    subscribers:
      type: integer
    feed_url:
      type: string
      format: uri
    link:
      type: string
      format: uri
ConversionInput:
  type: object
  description: Exactly one of `url` and `google_news`.
  additionalProperties: false
  properties:
    url:
      type: string
      maxLength: 2000
      description: A newsletter, blog, subreddit, YouTube channel or playlist, or feed address.
    google_news:
      type: object
      additionalProperties: false
      description: A search (`query`) or a topic (`topic`, from `GET /api/news/topics`).
      properties:
        query:
          type: string
        topic:
          type: string
        language:
          type: string
          default: en
        region:
          type: string
          default: US
Conversion:
  type: object
  required: [feed_url, platform]
  properties:
    feed_url:
      type: string
      format: uri
    platform:
      type: string
      enum:
        - substack
        - medium
        - ghost
        - buttondown
        - beehiiv
        - convertkit
        - revue
        - reddit
        - youtube
        - google-news
        - direct
        - generic
    title:
      type: string
NewsTopic:
  type: object
  required: [id, name]
  properties:
    id:
      type: string
    name:
      type: string
RecommendationInput:
  type: object
  required: [url, description]
  additionalProperties: false
  properties:
    url:
      type: string
      format: uri
    title:
      type: string
      maxLength: 200
    description:
      type: string
      minLength: 1
      maxLength: 1000
Recommendation:
  type: object
  required: [id, url, description, status]
  properties:
    id:
      type: string
    url:
      type: string
      format: uri
    title:
      type: string
    description:
      type: string
    status:
      type: string
      enum:
        - pending
        - approved
        - declined
    created_at:
      type: string
      format: date-time
    decided_at:
      type: string
      format: date-time
