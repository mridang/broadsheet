Feed:
  type: object
  required: [id, url, muted, position, section_ids, metadata]
  properties:
    id:
      type: string
    url:
      type: string
    title:
      type: string
      description: The person's own name for the feed, else the feed's.
    muted:
      type: boolean
      description: A muted feed stays followed but is left out of the paper. False again once a timed mute runs out.
    muted_until:
      type: string
      format: date-time
      description: When a timed mute runs out; absent when the feed is not muted for a time.
    position:
      type: integer
      minimum: 0
      description: Where the feed sits in the person's order; ties go by when it was followed.
    section_ids:
      type: array
      items:
        type: string
      description: Every section the feed is filed in, the one it prints under (`section_id`) first. A feed can sit in several, as in several NewsBlur folders; the paper prints it once.
    custom_icon:
      $ref: './icon.yaml#/Icon'
    auto_mark_read_days:
      $ref: './icon.yaml#/AutoMarkReadDays'
    section_id:
      type: string
      description: The section the feed is filed under; absent when none.
    created_at:
      type: string
      format: date-time
    format:
      type: string
      enum: [rss, atom, rdf]
      description: The kind of feed, as its document declares; absent until fetched.
    site_url:
      type: string
      description: The site the feed belongs to.
    description:
      type: string
    language:
      type: string
    icon:
      type: string
      description: The feed's own image, else the site's favicon.
    updated_at:
      type: string
      format: date-time
      description: When the feed says it last changed.
    update_minutes:
      type: integer
      description: How often the feed says it changes (sy:updatePeriod and sy:updateFrequency, else ttl).
    last_fetched_at:
      type: string
      format: date-time
    metadata:
      type: array
      description: Every element of the feed's header (the RSS or RDF channel, or the Atom feed, without its items), exactly as the feed gives it. Empty until fetched.
      items:
        $ref: '#/FeedElement'
FeedElement:
  type: object
  required: [name, attributes, text, children]
  properties:
    name:
      type: string
      description: The element's name as written, with any prefix (sy:updatePeriod, atom:link).
    attributes:
      type: object
      additionalProperties:
        type: string
    text:
      type: string
    children:
      type: array
      items:
        $ref: '#/FeedElement'
FeedChanges:
  type: object
  additionalProperties: false
  properties:
    title:
      type: [string, 'null']
      maxLength: 200
      description: The person's own name for the feed; null or blank goes back to the feed's own.
    url:
      type: string
      maxLength: 2048
      description: A new address for the feed, the way out of a feed that moved. The person follows that address in its place; 409 when they already follow it.
    muted:
      type: boolean
      description: False also forgets any time a mute was to run out.
    muted_until:
      type: [string, 'null']
      format: date-time
      description: When the mute runs out, or null to mute for good.
    position:
      type: integer
      minimum: 0
      maximum: 10000
    section_id:
      type: [string, 'null']
      pattern: '^[1-9][0-9]{0,14}$'
      description: One of the person's sections to print under, or null for none. The feed's other sections stay. Send either this or `section_ids`.
    section_ids:
      type: array
      maxItems: 50
      uniqueItems: true
      items:
        type: string
        pattern: '^[1-9][0-9]{0,14}$'
      description: Every section to file the feed in, replacing the old ones; it prints under the first. An empty list files it nowhere.
    custom_icon:
      oneOf:
        - $ref: './icon.yaml#/Icon'
        - type: 'null'
      description: The person's own icon for the feed, or null for the feed's own.
    auto_mark_read_days:
      oneOf:
        - $ref: './icon.yaml#/AutoMarkReadDays'
        - type: 'null'
FeedStatistics:
  type: object
  required:
    - fail_count
    - archive_count
    - subscribers
    - active_subscribers
    - story_count
    - stories_last_month
    - average_stories_per_month
    - stories_per_day
    - stories_per_month
    - stories_per_weekday
    - stories_per_hour
    - fetch_history
    - classifier_counts

  properties:
    last_fetched_at:
      type: string
      format: date-time
      description: Absent when the feed has not been fetched yet.
    last_error:
      type: string
      description: Why the last fetch failed; absent when it did not.
    fail_count:
      type: integer
      description: Fetches that failed in a row.
    update_minutes:
      type: integer
      description: Minutes the feed asks to be left between fetches, when it says.
    subscribers:
      type: integer
      description: People following the feed.
    active_subscribers:
      type: integer
      description: Those of them who have it unmuted.
    story_count:
      type: integer
    stories_last_month:
      type: integer
      description: Stories first seen in the last 30 days.
    average_stories_per_month:
      type: number
    stories_per_month:
      type: array
      description: Stories per month, newest first, at most 12 months.
      items:
        type: object
        required: [month, count]
        properties:
          month:
            type: string
            pattern: '^[0-9]{4}-[0-9]{2}$'
          count:
            type: integer
    stories_per_weekday:
      type: object
      description: Stories by day of the week, 0 being Sunday.
      additionalProperties:
        type: integer
    stories_per_hour:
      type: object
      description: Stories by hour of the day (UTC) they were published.
      additionalProperties:
        type: integer
    next_fetch_at:
      type: string
      format: date-time
      description: When the feed may be fetched again after failures; absent when it is due.
    archive_count:
      type: integer
      description: Stories whose full text has been kept.
    classifier_counts:
      type: object
      required: [focus, neutral, hidden]
      description: The caller's unread stories in the feed (the newest 300) by how their training scores them, as NewsBlur's per-feed focus, neutral and hidden counts.
      properties:
        focus:
          type: integer
          description: Stories training likes.
        neutral:
          type: integer
          description: Stories training neither likes nor dislikes.
        hidden:
          type: integer
          description: Stories training dislikes.
    last_load_time_ms:
      type: integer
      description: How long the last timed fetch took.
    fetch_history:
      type: array
      description: The latest fetches, newest first, at most 25.
      items:
        type: object
        required: [ok]
        properties:
          fetched_at:
            type: string
            format: date-time
          ok:
            type: boolean
          message:
            type: string
          duration_ms:
            type: integer
    stories_per_day:
      type: array
      description: Stories per edition day, newest first, at most 14 days.
      items:
        type: object
        required: [date, count]
        properties:
          date:
            type: string
            format: date
          count:
            type: integer
ImportSummary:
  type: object
  required: [added, skipped, sections_added, rejected]
  properties:
    added:
      type: integer
    skipped:
      type: integer
      description: Feeds the person already followed.
    sections_added:
      type: integer
    rejected:
      type: array
      items:
        type: object
        required: [url, reason]
        properties:
          url:
            type: string
          reason:
            type: string
FeedSuggestion:
  type: object
  required: [url, followers]
  properties:
    url:
      type: string
      format: uri
    title:
      type: string
    followers:
      type: integer
      minimum: 1
      description: How many people who share a source with the caller follow this one.
SimilarFeed:
  allOf:
    - $ref: '#/FeedSuggestion'
  type: object
  required: [stories]
  properties:
    stories:
      type: array
      maxItems: 5
      items:
        type: object
        required: [article_id, href]
        properties:
          article_id:
            type: string
          title:
            type: string
          href:
            type: string
