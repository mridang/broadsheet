Feed:
  type: object
  required: [id, url, muted]
  properties:
    id:
      type: string
    url:
      type: string
    title:
      type: string
      description: The person's own name for the feed, else the feed's.
    muted:
      type: boolean
      description: A muted feed stays followed but is left out of the paper.
    section_id:
      type: string
      description: The section the feed is filed under; absent when none.
    created_at:
      type: string
      format: date-time
FeedChanges:
  type: object
  additionalProperties: false
  properties:
    title:
      type: [string, 'null']
      maxLength: 200
      description: The person's own name for the feed; null or blank goes back to the feed's own.
    muted:
      type: boolean
    section_id:
      type: [string, 'null']
      pattern: '^[1-9][0-9]{0,14}$'
      description: One of the person's sections, or null for none.
FeedStatistics:
  type: object
  required: [fail_count, stories_per_day]
  properties:
    last_fetched_at:
      type: string
      format: date-time
      description: Absent when the feed has not been fetched yet.
    last_error:
      type: string
      description: Why the last fetch failed; absent when it did not.
    fail_count:
      type: integer
      description: Fetches that failed in a row.
    stories_per_day:
      type: array
      description: Stories per edition day, newest first, at most 14 days.
      items:
        type: object
        required: [date, count]
        properties:
          date:
            type: string
            format: date
          count:
            type: integer
ImportSummary:
  type: object
  required: [added, skipped, sections_added, rejected]
  properties:
    added:
      type: integer
    skipped:
      type: integer
      description: Feeds the person already followed.
    sections_added:
      type: integer
    rejected:
      type: array
      items:
        type: object
        required: [url, reason]
        properties:
          url:
            type: string
          reason:
            type: string
