Share:
  type: object
  required: [id, article_id, url, sharer]
  properties:
    id:
      type: string
    article_id:
      type: string
    url:
      type: string
      format: uri
    title:
      type: string
    source:
      type: string
    comments:
      type: string
      description: What the sharer said about the story; absent when nothing.
    shared_at:
      type: string
      format: date-time
    sharer:
      type: object
      description: Who shared it, by id and name, never by email.
      required: [id]
      properties:
        id:
          type: string
        name:
          type: string
ShareInput:
  type: object
  additionalProperties: false
  properties:
    comments:
      type:
        - string
        - 'null'
      maxLength: 5000
SharePage:
  type: object
  required: [self, items]
  properties:
    self:
      type: string
      format: uri
    next:
      type: string
      format: uri
    items:
      type: array
      items:
        $ref: '#/Share'
