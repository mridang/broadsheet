Icon:
  type: object
  additionalProperties: false
  required: [type, data]
  description: A custom icon, as NewsBlur has for folders and feeds.
  properties:
    type:
      type: string
      enum: [emoji, preset, upload]
    data:
      type: string
      description: The emoji (at most 8 characters), the icon's name in its set (lowercase letters, digits and hyphens), or a `data:image/png;base64,` URL of at most 100000 characters.
    color:
      type: string
      pattern: '^#[0-9a-fA-F]{6}$'
    set:
      type: string
      enum: [lucide, heroicons-solid]
      description: Only for a preset icon; lucide when not given.
AutoMarkReadDays:
  type: integer
  minimum: 0
  maximum: 365
  description: After how many days stories count as read and drop out of the reader's paper. 0 never marks them read; absent (or null when changing) inherits from the section above, else never.
