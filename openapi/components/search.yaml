SavedSearch:
  type: object
  required: [id, query, articles]
  properties:
    id:
      type: string
    query:
      type: string
      description: The words searched for, as `q` of `GET /api/articles`.
    feed_id:
      type: string
      description: The one feed searched within. Absent when every feed is searched.
    articles:
      type: string
      description: The `GET /api/articles` address that runs this search.
    created_at:
      type: string
      format: date-time
SavedSearchInput:
  type: object
  additionalProperties: false
  required: [query]
  properties:
    query:
      type: string
      minLength: 1
      maxLength: 200
    feed_id:
      type: [string, 'null']
      pattern: '^[1-9][0-9]{0,14}$'
SavedSearchPage:
  type: object
  required: [self, items]
  properties:
    self:
      type: string
    next:
      type: string
      description: The following page. Absent on the last page.
    items:
      type: array
      items:
        $ref: '#/SavedSearch'
