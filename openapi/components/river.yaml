River:
  description: A story list pinned to the left or right column of the front page.
  type: object
  required: [id, river_id, side, position]
  properties:
    id:
      type: string
    river_id:
      type: string
      description: What it lists. `all` (every feed), `saves`, or `feed:`, `section:`, `search:` or `edition:` and one of the person's own ids.
      pattern: '^(all|saves|(feed|section|search|edition):[1-9][0-9]{0,14})$'
    side:
      type: string
      enum: [left, right]
    position:
      type: integer
      minimum: 0
      maximum: 19
    created_at:
      type: string
      format: date-time
RiverInput:
  type: object
  additionalProperties: false
  required: [river_id, side, position]
  properties:
    river_id:
      type: string
      pattern: '^(all|saves|(feed|section|search|edition):[1-9][0-9]{0,14})$'
    side:
      type: string
      enum: [left, right]
    position:
      type: integer
      minimum: 0
      maximum: 19
RiverList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      maxItems: 20
      description: No two at the same side and position.
      items:
        $ref: '#/RiverInput'
RiverPage:
  type: object
  required: [self, items]
  properties:
    self:
      type: string
    items:
      type: array
      maxItems: 20
      items:
        $ref: '#/River'
