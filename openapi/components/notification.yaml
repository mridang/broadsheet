NotificationChannels:
  type: array
  minItems: 1
  uniqueItems: true
  items:
    type: string
    enum: [web, email, webhook]
NotificationInput:
  type: object
  additionalProperties: false
  required: [channels]
  properties:
    filter:
      type: string
      enum: [unread, focus]
      default: unread
    channels:
      $ref: '#/NotificationChannels'
Notification:
  type: object
  required: [feed_id, filter, channels]
  properties:
    feed_id:
      type: string
    filter:
      type: string
      enum: [unread, focus]
    channels:
      $ref: '#/NotificationChannels'
NotificationRuleInput:
  type: object
  additionalProperties: false
  required: [kind, value, channels]
  properties:
    kind:
      type: string
      enum: [title, author, tag, text, url, prompt]
      description: With `prompt`, the value is the reader's own words and Workers AI judges each new story in scope against them, each question counting against the daily AI classifier budget.
    value:
      type: string
      minLength: 1
      maxLength: 200
    is_regex:
      type: boolean
      default: false
      description: Only for title, author, text and url.
    scope:
      type: string
      enum: [feed, section, all]
      default: all
    feed_id:
      type: string
      description: Required with `feed`, and only allowed with it.
    section_id:
      type: string
      description: Required with `section`, and only allowed with it.
    channels:
      $ref: '#/NotificationChannels'
NotificationRule:
  type: object
  required: [id, kind, value, is_regex, scope, channels]
  properties:
    id:
      type: string
    kind:
      type: string
      enum: [title, author, tag, text, url, prompt]
    value:
      type: string
    is_regex:
      type: boolean
    scope:
      type: string
      enum: [feed, section, all]
    feed_id:
      type: string
    section_id:
      type: string
    channels:
      $ref: '#/NotificationChannels'
    created_at:
      type: string
      format: date-time
