NotificationChannels:
  type: array
  minItems: 1
  uniqueItems: true
  items:
    type: string
    enum: [web, email, webhook]
NotificationInput:
  type: object
  additionalProperties: false
  required: [channels]
  properties:
    filter:
      type: string
      enum: [unread, focus]
      default: unread
    channels:
      $ref: '#/NotificationChannels'
Notification:
  type: object
  required: [feed_id, filter, channels]
  properties:
    feed_id:
      type: string
    filter:
      type: string
      enum: [unread, focus]
    channels:
      $ref: '#/NotificationChannels'
