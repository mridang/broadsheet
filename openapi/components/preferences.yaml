Preferences:
  type: object
  required:
    - story_clustering
    - cluster_mode
    - cluster_mark_read
    - briefing
    - intelligence
    - mark_read_on_open
    - auto_mark_read_days
  properties:
    story_clustering:
      type: boolean
      description: Print the same story from several sources once. Clusters are only found while the server's Vectorize index is bound.
    cluster_mode:
      type: string
      enum: [title, related]
      description: '`title` folds only copies whose headlines match; `related` also folds those that mean the same.'
    cluster_mark_read:
      type: boolean
      description: Opening one copy of a story marks its other copies read.
    briefing:
      $ref: '#/BriefingPreferences'
    intelligence:
      $ref: '#/Intelligence'
    mark_read_on_open:
      type: boolean
      description: Opening a story marks it read.
    auto_mark_read_days:
      type: integer
      minimum: 0
      maximum: 365
      description: Days after which stories count as read when no feed or section says (0 never).
Intelligence:
  type: string
  enum: [focus, unread, all]
  description: How much of the paper training lets through, as NewsBlur's intelligence levels. Focus shows only liked stories, unread all but disliked ones, all every story with disliked ones last.
BriefingPreferences:
  type: object
  required: [enabled, story_count, length, style, read_filter]
  properties:
    enabled:
      type: boolean
      description: Write an editor's note on each day's paper.
    story_count:
      type: integer
      enum: [5, 10, 15, 20, 25]
    length:
      type: string
      enum: [short, medium, detailed]
    style:
      type: string
      enum: [editorial, bullets, headlines]
    read_filter:
      type: string
      enum: [unread, focus]
      description: '`focus` covers only stories the person trained the paper to like.'
PreferenceChanges:
  type: object
  additionalProperties: false
  properties:
    intelligence:
      $ref: '#/Intelligence'
    mark_read_on_open:
      type: boolean
    auto_mark_read_days:
      type: integer
      minimum: 0
      maximum: 365
    story_clustering:
      type: boolean
    cluster_mode:
      type: string
      enum: [title, related]
    cluster_mark_read:
      type: boolean
    briefing:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        story_count:
          type: integer
          enum: [5, 10, 15, 20, 25]
        length:
          type: string
          enum: [short, medium, detailed]
        style:
          type: string
          enum: [editorial, bullets, headlines]
        read_filter:
          type: string
          enum: [unread, focus]
