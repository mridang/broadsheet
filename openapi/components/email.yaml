EmailInput:
  type: object
  additionalProperties: false
  required: [to]
  properties:
    to:
      description: One to ten addresses, as a list or one string separated by commas or spaces.
      oneOf:
        - type: string
        - type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            format: email
    comment:
      type: string
      maxLength: 2048
      description: The sender's note, shown above the story.
    from_name:
      type: string
      maxLength: 200
      description: The name the email goes out under, instead of the account's.
    copy_me:
      type: boolean
      default: true
      description: Whether the sender gets a copy.
EmailAccepted:
  type: object
  required: [status]
  properties:
    status:
      type: string
      enum: [accepted]
