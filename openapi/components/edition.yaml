Edition:
  type: object
  required: [id, name, section_ids]
  properties:
    id:
      type: string
    name:
      type: string
    section_ids:
      type: array
      description: The sections whose feeds the edition prints; empty prints every feed.
      items:
        type: string
    query:
      type: string
      description: Only stories whose title, summary or text holds every word.
    tag:
      type: string
      description: Only stories the person saved under this tag.
    created_at:
      type: string
      format: date-time
EditionChanges:
  type: object
  additionalProperties: false
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 200
    section_ids:
      type: array
      maxItems: 50
      items:
        type: string
        pattern: '^[1-9][0-9]{0,14}$'
    query:
      type: [string, 'null']
      maxLength: 200
      description: Null or blank clears it.
    tag:
      type: [string, 'null']
      maxLength: 50
      description: Null or blank clears it.
